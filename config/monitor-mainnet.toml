# CSR Network Monitor – example configuration for mainnet.
# One process serves one network. Copy to /etc/csr-network-monitor/monitor-mainnet.toml.

network = "mainnet"
public_url = "https://monitor.example.org"        # shown in /v1/monitor
node_rpc = "http://127.0.0.1:8114"                # local synced CKB node (loopback only)
db_path = "/var/lib/csr-network-monitor/mainnet/monitor.db"
key_path = "/var/lib/csr-network-monitor/mainnet/monitor.key"
# salt_path = "/var/lib/csr-network-monitor/mainnet/monitor.db.salt"   # default: db_path + ".salt"

listen_host = "127.0.0.1"                         # put a reverse proxy (Caddy) in front
listen_port = 8481

# --- probing ---
probe_interval_s = 600        # slot length; one recorded outcome per runner per slot
probe_jitter_s = 60
probe_timeout_s = 5
probe_workers = 32
sync_threshold = 10           # blocks behind that still count as in sync
# second_tip_source = "http://127.0.0.1:8115"     # optional second node for the tip cross-check
crosscheck_interval_s = 600
aggregate_interval_s = 600

# --- registration discovery ---
# Type script of the registration cells (set once the on-chain script is decided).
registration_code_hash = ""
registration_hash_type = "type"
registration_args = "0x"
allow_insecure_endpoints = false   # true only for tests (allows http:// and loopback endpoints)

# --- geolocation (DB-IP Lite CSV; GeoLite2 must be converted to the same columns) ---
# geo_country_csv = "/var/lib/csr-network-monitor/geo/dbip-country-lite.csv"
# geo_asn_csv = "/var/lib/csr-network-monitor/geo/dbip-asn-lite.csv"

# --- P2P full-node check (external helper, see docs/P2P_HELPER.md) ---
# p2p_check_cmd = "/opt/csr-network-monitor/bin/p2p-helper"
p2p_check_timeout_s = 120
p2p_interval_s = 86400

# --- API ---
rate_limit_per_min = 60
trusted_proxies = ["127.0.0.1", "::1"]   # X-Forwarded-For is honoured only from these

# --- ranking gates and retention ---
gate_min_days = 365
gate_min_runners = 60
gate_max_asn_share = 0.25
gate_max_country_share = 0.5
provisional_days = 7
probe_retention_days = 90

# --- stat cell (weekly signed summary on chain) ---
# Keep disabled until the monitor address is funded and every value below has been
# verified on the chosen network.
stat_cell_enabled = false
